# Minmax oxide color scheme for WezTerm.
# Uses the standard 16 ANSI slots without overwriting the 256-color cube.

[colors]
foreground = "#83b5a3"
background = "#090e0d"
cursor_bg = "#b4d8c4"
cursor_border = "#b4d8c4"
cursor_fg = "#090e0d"
selection_bg = "#2d4943"
selection_fg = "#b4d8c4"
scrollbar_thumb = "#496b61"
split = "#2d4943"
compose_cursor = "#e0ad83"
visual_bell = "#cf7770"

ansi = ["#090e0d", "#cf7770", "#628f7c", "#c58b67", "#496b61", "#a5b994", "#2d4943", "#83b5a3"]
brights = ["#2d4943", "#cf7770", "#b4d8c4", "#e0ad83", "#628f7c", "#a5b994", "#496b61", "#b4d8c4"]

[colors.tab_bar]
background = "#090e0d"

[colors.tab_bar.active_tab]
bg_color = "#628f7c"
fg_color = "#090e0d"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
bg_color = "#2d4943"
fg_color = "#496b61"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#496b61"
fg_color = "#b4d8c4"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#090e0d"
fg_color = "#628f7c"

[colors.tab_bar.new_tab_hover]
bg_color = "#c58b67"
fg_color = "#090e0d"
italic = true

[metadata]
name = "Minmax Oxide"
author = "soulz3r"
